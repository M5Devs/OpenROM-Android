name: Release

on:
  push:
    tags: ['v*']

# `contents: write` is required to attach the signed APK to the Release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENROM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret configured; the release will be unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openrom.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          OPENROM_KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/openrom.jks', runner.temp) || '' }}
          OPENROM_KEYSTORE_PASSWORD: ${{ secrets.OPENROM_KEYSTORE_PASSWORD }}
          OPENROM_KEY_ALIAS: ${{ secrets.OPENROM_KEY_ALIAS }}
          OPENROM_KEY_PASSWORD: ${{ secrets.OPENROM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
